name: webui

on:
  workflow_call:

jobs:
  build:
    # continue-on-error: true
    timeout-minutes: 10

    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        # Use LTS version only
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [24.x]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Glances will be build with Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./glances/outputs/static/package-lock.json
    - name: Build Glances WebUI
      working-directory: ./glances/outputs/static
      run: |
        npm ci
        npm run build
    - name: Check that the committed bundle matches the sources
      # The bundle is committed with the sources (make webui); CI only
      # verifies it, it never pushes to the branch (security audit
      # 2026-10-17, S-8).
      run: |
        if ! git diff --exit-code --stat -- glances/outputs/static/public; then
          echo "::error::glances/outputs/static/public is out of date: run 'make webui' and commit the bundle"
          exit 1
        fi
